<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <meta name="theme-color" content="#111827">
        <meta name="description" content="A simple rock, paper, scissors game.">
        <title>Rock, Paper, Scissors</title>
        <link rel="stylesheet" href="css/style.css">
        <script src="js/javascript.js" defer></script>
    </head>
    <body>
        <main class="game" aria-labelledby="game-title">
            <header class="game__header">
                <p class="eyebrow">Simple game</p>
                <h1 id="game-title">Rock, Paper, Scissors</h1>
                <p class="subtitle">Choose an option and play against the computer.</p>
            </header>

            <section class="scoreboard" aria-labelledby="score-title">
                <h2 id="score-title" class="sr-only">Game score</h2>
                <div class="score score--wins">
                    <span class="score__label">Wins</span>
                    <strong id="t_wins" class="score__value">0</strong>
                </div>
                <div class="score score--draws">
                    <span class="score__label">Draws</span>
                    <strong id="t_draws" class="score__value">0</strong>
                </div>
                <div class="score score--losses">
                    <span class="score__label">Losses</span>
                    <strong id="t_loss" class="score__value">0</strong>
                </div>
            </section>

            <section class="arena" aria-labelledby="round-title">
                <h2 id="round-title" class="sr-only">Round result</h2>
                <div class="player">
                    <span class="player__label">You</span>
                    <div class="player__image-wrap">
                        <img id="human_choice" src="images/giphy.gif" alt="Waiting for your choice">
                    </div>
                </div>

                <div class="round-status">
                    <span class="round-status__versus" aria-hidden="true">VS</span>
                    <p id="round_result" role="status" aria-live="polite">Choose an option</p>
                </div>

                <div class="player">
                    <span class="player__label">Computer</span>
                    <div class="player__image-wrap">
                        <img id="machine_choice" src="images/giphy_machine.gif" alt="Waiting for the computer's choice">
                    </div>
                </div>
            </section>

            <section class="controls" aria-labelledby="choice-title">
                <div class="controls__heading">
                    <div>
                        <p class="eyebrow">Your turn</p>
                        <h2 id="choice-title">Choose an option</h2>
                    </div>
                    <button id="reset" class="button button--ghost" type="button" aria-label="Reset the game and set the score to zero">
                        Reset
                    </button>
                </div>

                <div class="choice-list" role="group" aria-label="Game options">
                    <button class="choice" type="button" data-choice="1" aria-pressed="false">
                        <img src="images/icon-rock.png" alt="" aria-hidden="true">
                        <span>Rock</span>
                    </button>
                    <button class="choice" type="button" data-choice="2" aria-pressed="false">
                        <img src="images/icon-paper.png" alt="" aria-hidden="true">
                        <span>Paper</span>
                    </button>
                    <button class="choice" type="button" data-choice="3" aria-pressed="false">
                        <img src="images/icon-scissors.png" alt="" aria-hidden="true">
                        <span>Scissors</span>
                    </button>
                </div>

                <button id="play" class="button button--primary" type="button" disabled>
                    Play round
                </button>
                <p id="choice_help" class="help-text">Select an option to continue.</p>
            </section>
        </main>
    </body>
</html>
